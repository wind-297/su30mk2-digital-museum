<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#152238"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#d4af37" stroke-width="2"/>
  <!-- Stylized aircraft silhouette -->
  <g transform="translate(32, 32) rotate(-30)">
    <!-- Fuselage -->
    <path d="M-2,-20 L0,-24 L2,-20 L2,14 L-2,14 Z" fill="#d4af37"/>
    <!-- Wings -->
    <path d="M-2,-2 L-16,8 L-14,10 L-2,4 Z" fill="#d4af37" opacity="0.9"/>
    <path d="M2,-2 L16,8 L14,10 L2,4 Z" fill="#d4af37" opacity="0.9"/>
    <!-- Tail fins -->
    <path d="M-2,10 L-8,16 L-6,17 L-2,14 Z" fill="#d4af37" opacity="0.8"/>
    <path d="M2,10 L8,16 L6,17 L2,14 Z" fill="#d4af37" opacity="0.8"/>
    <!-- Canopy highlight -->
    <ellipse cx="0" cy="-16" rx="1" ry="3" fill="#fff" opacity="0.4"/>
  </g>
  <!-- Star accent -->
  <polygon points="32,4 33.5,8 38,8 34.5,10.5 36,15 32,12 28,15 29.5,10.5 26,8 30.5,8"
           fill="#d4af37" opacity="0.6" transform="scale(0.5) translate(32, 4)"/>
</svg>
